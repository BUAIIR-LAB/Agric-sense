<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Subtle gradient for depth (no filter - ensures reliable render on splash/icon) -->
    <linearGradient id="circleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F5F9F5"/>
    </linearGradient>
  </defs>
  <!-- Solid circle: no filter so it always shows on splash and icon -->
  <circle cx="512" cy="512" r="380" fill="url(#circleFill)" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
</svg>
